<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>390px 레이아웃 검수</title>
<style>
  body{margin:0;background:#2a2d35;display:flex;gap:14px;padding:10px;color:#c9cfdd;
       font:12px -apple-system,'Noto Sans KR',sans-serif}
  .col{display:flex;flex-direction:column;gap:6px}
  .frame{background:#000;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .cap{margin:0;font-size:11px;color:#9aa2b4}
  iframe{width:390px;height:844px;border:0;display:block}
  #m{margin-left:8px;color:#ffd166;font-size:11px;max-width:820px}
</style></head>
<body>
  <div class="col">
    <p class="cap">A · 사진 + 텍스트 편집 (390×844)</p>
    <div class="frame"><iframe id="fa" src="./index.html?a=1"></iframe></div>
  </div>
  <div class="col">
    <p class="cap">B · 사진 패널 (390×844)</p>
    <div class="frame"><iframe id="fb" src="./index.html?b=1"></iframe></div>
  </div>
  <div id="m">측정 중…</div>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
async function ready(f){ if (f.contentWindow.__PE_READY__) return; await new Promise(r => { const t = setInterval(() => { if (f.contentWindow.__PE_READY__) { clearInterval(t); r(); } }, 60); }); }

(async () => {
  const fa = document.getElementById('fa'), fb = document.getElementById('fb');
  await ready(fa); await ready(fb);
  const A = fa.contentWindow, Ad = A.document, PA = A.__PE__;
  await PA.E.loadSample(); await wait(500);
  PA.E.setTool('text'); await wait(200);
  Ad.getElementById('btnAddText').click(); await wait(300);
  Ad.getElementById('txText').value = '제주 바다 여행\n2026 가을';
  Ad.getElementById('txText').dispatchEvent(new Event('input', { bubbles: true }));
  const set = (id, v) => { const el = Ad.getElementById(id); el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); };
  set('txStrokeColor', '#ff2d55'); set('txStrokeWidth', '8'); set('txSize', '11');
  await wait(300);

  const B = fb.contentWindow, Bd = B.document, PB = B.__PE__;
  PB.E.setTool('photo'); await wait(300);

  await wait(400);
  const rep = [];
  for (const [name, w] of [['A', A], ['B', B]]) {
    const d = w.document;
    const over = d.documentElement.scrollWidth - w.innerWidth;
    const wide = [...d.querySelectorAll('body *')].filter(el => {
      const r = el.getBoundingClientRect();
      return r.right > w.innerWidth + 1 && r.width > 0 && getComputedStyle(el).position !== 'fixed';
    }).slice(0, 4).map(el => el.tagName + '.' + (el.className || '').toString().slice(0, 22) + '@' + Math.round(el.getBoundingClientRect().right));
    rep.push(`${name}: 뷰포트 ${w.innerWidth}×${w.innerHeight} · 가로넘침 ${over > 0 ? over + 'px' : '없음'} ${wide.length ? '· ' + wide.join(', ') : ''}`);
  }
  document.getElementById('m').textContent = rep.join('  |  ');
})();
</script>
</body></html>
