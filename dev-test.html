<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>photo-editor 제스처 검수</title>
<style>
  html,body{margin:0;background:#181a20;color:#dfe3ee;font:12px/1.5 -apple-system,'Noto Sans KR',sans-serif}
  body{display:flex;gap:10px;padding:8px;box-sizing:border-box}
  #f{width:1100px;height:820px;border:0;background:#000;border-radius:8px;display:block}
  #side{width:420px}
  #log{white-space:pre-wrap;font-size:11px;color:#b9c0d0;background:#101319;border:1px solid #2a3140;
       border-radius:8px;padding:8px;height:660px;overflow:auto;margin-top:8px}
  button{font:inherit;background:#2a2f3a;color:#e8eaf0;border:1px solid #3c4456;border-radius:8px;
         padding:6px 10px;cursor:pointer;margin:0 4px 6px 0}
  .ok{color:#7ee2b8}.warn{color:#ffd166}
</style></head>
<body>
  <iframe id="f"></iframe>
  <div id="side">
    <button id="b0">캐시 새로고침 후 앱 로드</button><br>
    <button id="b1">1단계 (필터·텍스트·모자이크·그리기·도형)</button>
    <button id="b2">2단계 (자르기)</button>
    <button id="b3">3단계 (Undo/Redo·내보내기)</button>
    <button id="b4">4단계 (링크 불러오기 모의)</button>
    <div id="log">준비…</div>
  </div>
<script>
const f = document.getElementById('f');
const logEl = document.getElementById('log');
let lines = [];
function log(s) { lines.push('· ' + s); logEl.textContent = lines.join('\n'); logEl.scrollTop = 1e6; }
const wait = ms => new Promise(r => setTimeout(r, ms));

document.getElementById('b0').onclick = async () => {
  lines = ['에셋 캐시 새로고침…']; logEl.textContent = lines.join('\n');
  const assets = ['./index.html', './styles.css', './js/boot.js', './js/editor.js',
                  './js/ui.js', './js/state.js', './js/render.js', './assets/icon.svg'];
  for (const a of assets) {
    try { const r = await fetch(a, { cache: 'reload' }); log(a + ' → ' + r.status); }
    catch (e) { log(a + ' 실패 ' + e.message); }
  }
  f.src = './index.html?cb=' + Date.now();
  await new Promise(res => { f.onload = res; });
  await new Promise(res => { const t = setInterval(() => { if (f.contentWindow.__PE_READY__) { clearInterval(t); res(); } }, 60); });
  log('앱 로드 완료 · __PE__ = ' + !!f.contentWindow.__PE__);
};

function ctx() { return { w: f.contentWindow, d: f.contentWindow.document, PE: f.contentWindow.__PE__ }; }
function ptr(d, type, x, y, buttons) {
  const el = d.getElementById('overlay');
  const r = el.getBoundingClientRect();
  el.dispatchEvent(new PointerEvent(type, {
    clientX: r.left + x * r.width, clientY: r.top + y * r.height,
    bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse',
    isPrimary: true, buttons: buttons === undefined ? (type === 'pointerup' ? 0 : 1) : buttons, button: 0,
  }));
}
async function drag(d, x1, y1, x2, y2, steps = 14) {
  ptr(d, 'pointerdown', x1, y1);
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    ptr(d, 'pointermove', x1 + (x2 - x1) * t, y1 + (y2 - y1) * t);
    await wait(6);
  }
  ptr(d, 'pointerup', x2, y2, 0);
  await wait(50);
}
function setInput(d, id, value) {
  const el = d.getElementById(id);
  el.value = value;
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
}

document.getElementById('b1').onclick = async () => {
  const { w, d, PE } = ctx();
  if (!PE) return log('먼저 앱을 로드하세요');
  try {
    await PE.E.loadSample(); await wait(400);
    log('사진: ' + JSON.stringify(PE.R.outputSize()) + ' / 캔버스 ' + d.getElementById('view').width + 'px');

    d.querySelector('#rail .tool[data-tool="adjust"]').click(); await wait(120);
    d.querySelector('#filterGrid .filter-btn[data-preset="vivid"]').click(); await wait(150);
    log('필터: ' + JSON.stringify(PE.S.adj));

    d.querySelector('#rail .tool[data-tool="text"]').click(); await wait(120);
    d.getElementById('btnAddText').click(); await wait(150);
    d.getElementById('txText').value = '오늘도 화이팅!';
    d.getElementById('txText').dispatchEvent(new Event('input', { bubbles: true }));
    setInput(d, 'txStrokeColor', '#ff2d55');
    setInput(d, 'txStrokeWidth', '7');
    setInput(d, 'txShadowColor', '#1a0b2e');
    setInput(d, 'txShadowBlur', '22');
    setInput(d, 'txShadowY', '9');
    setInput(d, 'txSize', '13');
    setInput(d, 'txBgOn', '');
    d.getElementById('txBgOn').checked = true;
    d.getElementById('txBgOn').dispatchEvent(new Event('change', { bubbles: true }));
    setInput(d, 'txBgColor', '#1a0b2e');
    setInput(d, 'txBgAlpha', '55');
    await wait(250);
    const t = PE.S.layers.find(l => l.type === 'text');
    log('텍스트: ' + JSON.stringify({ text: t.text, size: t.size, stroke: t.stroke, shadow: t.shadow, bg: t.bg }));

    d.querySelector('#rail .tool[data-tool="mosaic"]').click(); await wait(120);
    setInput(d, 'mosaicSize', '26');
    PE.S.sel = null;
    await drag(d, 0.70, 0.26, 0.92, 0.50);
    log('모자이크: ' + PE.S.layers.filter(l => l.type === 'mosaic').length + '개');

    d.querySelector('#rail .tool[data-tool="draw"]').click(); await wait(120);
    d.querySelector('#drawModes .chip[data-mode="marker"]').click();
    setInput(d, 'drawColor', '#ffe066');
    PE.S.sel = null;
    ptr(d, 'pointerdown', 0.10, 0.60);
    for (let i = 1; i <= 20; i++) { ptr(d, 'pointermove', 0.10 + i * 0.019, 0.60 + Math.sin(i / 2.6) * 0.03); await wait(6); }
    ptr(d, 'pointerup', 0.48, 0.60, 0);
    await wait(60);
    log('형광펜: ' + PE.S.layers.filter(l => l.type === 'stroke').length + '개 (점 ' +
        (PE.S.layers.find(l => l.type === 'stroke')?.points.length) + ')');

    d.querySelector('#rail .tool[data-tool="shape"]').click(); await wait(120);
    d.querySelector('#shapeKinds .chip[data-shape="arrow"]').click();
    setInput(d, 'shapeColor', '#3ddc97');
    PE.S.sel = null;
    await drag(d, 0.14, 0.22, 0.38, 0.40);
    log('도형: ' + PE.S.layers.filter(l => l.type === 'shape').length + '개');
    log('레이어 합계: ' + PE.S.layers.length + ' · undo 가능 ' + PE.State.historyState().canUndo);
    log('— 1단계 완료');
  } catch (e) { log('오류: ' + (e && e.message)); console.error(e); }
};

document.getElementById('b2').onclick = async () => {
  const { w, d, PE } = ctx();
  try {
    const before = PE.R.outputSize();
    d.querySelector('#rail .tool[data-tool="crop"]').click(); await wait(300);
    log('자르기 모드: 캔버스 ' + PE.R.outputSize().w + '×' + PE.R.outputSize().h + ' / draft ' + JSON.stringify(PE.S.cropDraft));
    d.querySelector('#aspectChips .chip[data-aspect="1:1"]').click(); await wait(200);
    log('1:1 → ' + JSON.stringify(PE.S.cropDraft));
    log('픽셀 크기 → ' + Math.round(PE.S.cropDraft.w * 1600) + '×' + Math.round(PE.S.cropDraft.h * 1200));
    const seX = PE.S.cropDraft.x + PE.S.cropDraft.w, seY = PE.S.cropDraft.y + PE.S.cropDraft.h;
    await drag(d, seX - 0.006, seY - 0.006, 0.70, 0.80);
    log('핸들 드래그 → ' + JSON.stringify(PE.S.cropDraft) + ' (' + Math.round(PE.S.cropDraft.w * 1600) + '×' + Math.round(PE.S.cropDraft.h * 1200) + ')');
    d.getElementById('btnCropApply').click(); await wait(350);
    const after = PE.R.outputSize();
    log('적용 ' + before.w + '×' + before.h + ' → ' + after.w + '×' + after.h + ' · 도구 ' + PE.S.tool);
  } catch (e) { log('오류: ' + (e && e.message)); console.error(e); }
};

document.getElementById('b4').onclick = async () => {
  const { w, d, PE } = ctx();
  try {
    const ww = w;
    // 집 PC 스튜디오 응답 모의
    const mk = (n, color) => {
      const c = d.createElement('canvas'); c.width = 900; c.height = 1200;
      const g = c.getContext('2d');
      g.fillStyle = color; g.fillRect(0, 0, 900, 1200);
      g.fillStyle = '#fff'; g.font = 'bold 90px sans-serif'; g.fillText('LINK ' + n, 80, 620);
      return c.toDataURL('image/jpeg', 0.85);
    };
    const imgs = [mk(1, '#7c5cff'), mk(2, '#ff6b6b')];
    const realFetch = ww.fetch;
    ww.fetch = async (u, o) => {
      if (String(u).includes('/api/health')) return new Response(JSON.stringify({ ok: true }), { status: 200, headers: { 'Content-Type': 'application/json' } });
      if (String(u).includes('/api/extract-media')) {
        niceLog(o && o.body);
        return new Response(JSON.stringify({ ok: true, images: [
          { dataUrl: imgs[0], name: '인스타 1' },
          { url: imgs[1], name: '쓰레드 2' },
        ] }), { status: 200, headers: { 'Content-Type': 'application/json' } });
      }
      return realFetch(u, o);
    };
    const niceLog = b => { try { log('요청 본문 ' + b); } catch (e) {} };

    d.getElementById('btnLink').click();
    await wait(400);
    log('상태: ' + d.getElementById('linkStatusText').textContent);
    d.getElementById('linkUrl').value = 'https://www.instagram.com/p/TEST123/';
    d.getElementById('btnLinkFetch').click();
    await wait(700);
    log('결과 카드: ' + d.querySelectorAll('#linkResults .link-card').length + ' · ' + d.getElementById('linkStatusText').textContent);
    d.getElementById('btnLinkAddAll').click();
    await wait(900);
    log('슬롯: ' + PE.S.slots.length + ' · 현재 ' + PE.S.slots[PE.S.slots.length-1].name + ' ' + JSON.stringify(PE.R.outputSize()));
    log('모달 열림: ' + d.getElementById('linkModal').classList.contains('is-on'));
    ww.fetch = realFetch;
    log('— 4단계 완료');
  } catch (e) { log('오류: ' + (e && e.message)); console.error(e); }
};

document.getElementById('b3').onclick = async () => {
  const { w, d, PE } = ctx();
  try {
    const n0 = PE.S.layers.length;
    PE.State.undo(); PE.E.afterHistory(); await wait(200);
    const n1 = PE.S.layers.length;
    PE.State.redo(); PE.E.afterHistory(); await wait(200);
    log('Undo ' + n0 + '→' + n1 + ' · Redo ' + n1 + '→' + PE.S.layers.length);

    const out = await PE.E.buildExport();
    log('내보내기 ' + out.W + '×' + out.H + ' · ' + out.mime + ' · ' + Math.round(out.blob.size / 1024) + 'KB');
    const dim = await new Promise(res => {
      const i = new Image(); i.onload = () => res(i.naturalWidth + '×' + i.naturalHeight);
      i.onerror = () => res('decode fail'); i.src = URL.createObjectURL(out.blob);
    });
    log('디코딩 ' + dim);
    log('레이어 ' + PE.S.layers.map(l => l.type).join(','));
  } catch (e) { log('오류: ' + (e && e.message)); console.error(e); }
};
</script>
</body></html>
