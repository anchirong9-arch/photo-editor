<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>1440 PC 검수</title>
<style>
  body{margin:0;background:#2a2d35;padding:8px;color:#c9cfdd;font:12px -apple-system,'Noto Sans KR',sans-serif}
  iframe{width:1440px;height:900px;border:0;border-radius:10px;display:block;background:#000}
  #m{color:#ffd166;font-size:11px;margin:6px 0 0}
</style></head><body>
<iframe id="f" src="./index.html?pc=1"></iframe>
<div id="m">측정 중…</div>
<script>
const f=document.getElementById('f');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{
  await new Promise(r=>{const t=setInterval(()=>{if(f.contentWindow.__PE_READY__){clearInterval(t);r();}},60);});
  const w=f.contentWindow,d=w.document,PE=w.__PE__;
  await PE.E.loadSample(); await wait(500);
  PE.E.setTool('text'); await wait(150);
  d.getElementById('btnAddText').click(); await wait(250);
  d.getElementById('txText').value='1440px 화면 검수';
  d.getElementById('txText').dispatchEvent(new Event('input',{bubbles:true}));
  await wait(400);
  const over=d.documentElement.scrollWidth - w.innerWidth;
  const wide=[...d.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect();return r.right>w.innerWidth+1&&r.width>0&&getComputedStyle(el).position!=='fixed';}).slice(0,5).map(el=>el.tagName+'.'+String(el.className).slice(0,20)+'@'+Math.round(el.getBoundingClientRect().right));
  document.getElementById('m').textContent=`뷰포트 ${w.innerWidth}×${w.innerHeight} · 가로넘침 ${over>0?over+'px':'없음'} ${wide.length?'· '+wide.join(', '):''} · 캔버스 ${d.getElementById('view').getBoundingClientRect().width}px`;
})();
</script></body></html>
